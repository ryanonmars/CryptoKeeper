name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build artifacts and validate tap access without creating a release
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Resolve validated release version
        id: release-version
        shell: bash
        env:
          TAG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          project_version=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/cli/Cargo.toml | head -n 1)
          if [[ -z "$project_version" ]]; then
            echo "Could not resolve the project version" >&2
            exit 1
          fi

          node scripts/validate-release-version.mjs "${TAG_VERSION:-v$project_version}"
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Test Node scripts
        run: node --test scripts/*.test.mjs

      - name: Audit JavaScript dependencies
        run: npm audit

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2

      - name: Audit Rust dependencies
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo audit --file Cargo.lock

  rust-platforms:
    name: Release Rust checks (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux x86_64
          - os: macos-15-intel
            platform: macOS Intel
          - os: macos-15
            platform: macOS ARM
          - os: windows-latest
            platform: Windows x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact release source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --all-features --locked

  build:
    name: Build for ${{ matrix.platform }}
    needs:
      - validate
      - rust-platforms
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            asset_name: termkey-linux-x86_64
          - os: macos-15-intel
            platform: macos
            target: x86_64-apple-darwin
            macos_arch: x86_64
            macos_deployment_target: '11.0'
            asset_name: termkey-macos-x86_64
          - os: macos-15
            platform: macos
            target: aarch64-apple-darwin
            macos_arch: arm64
            macos_deployment_target: '11.0'
            asset_name: termkey-macos-aarch64
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            asset_name: termkey-windows-x86_64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build browser extension
        run: npm run build:extension

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Check Windows signing configuration
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $enabled = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -and
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          "WINDOWS_SIGNING_ENABLED=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

          if (-not $enabled) {
            "### Windows artifacts are unsigned`n`nThe complete Windows signing secret set was not available." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Configure Windows signing certificate
        if: matrix.platform == 'windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "termkey-signing.pfx"
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV

          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) {
            throw "signtool.exe was not found"
          }

          "WINDOWS_SIGNTOOL=$($signTool.FullName)" >> $env:GITHUB_ENV

      - name: Sign Windows executables
        if: matrix.platform == 'windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "target/${{ matrix.target }}/release"
          $executables = @(
            (Join-Path $releaseDir "termkey.exe"),
            (Join-Path $releaseDir "termkey-native-host.exe")
          )

          & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD $executables
          if ($LASTEXITCODE -ne 0) { throw "Windows executable signing failed" }
          foreach ($executable in $executables) {
            & $env:WINDOWS_SIGNTOOL verify /pa $executable
            if ($LASTEXITCODE -ne 0) { throw "Windows signature verification failed: $executable" }
          }

      - name: Check Apple signing configuration
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE_BASE64" \
            && -n "$APPLE_CERTIFICATE_PASSWORD" \
            && -n "$APPLE_APPLICATION_SIGNING_IDENTITY" \
            && -n "$APPLE_INSTALLER_SIGNING_IDENTITY" ]]; then
            echo "APPLE_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            {
              echo "### macOS artifacts are unsigned"
              echo
              echo "The complete Apple signing secret set was not available."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Apple signing certificate
        if: matrix.platform == 'macos' && env.APPLE_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/termkey-signing.p12"
          keychain_path="$RUNNER_TEMP/termkey-signing.keychain-db"
          echo "APPLE_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Sign macOS executables
        if: matrix.platform == 'macos' && env.APPLE_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
        run: |
          release_dir="${{ github.workspace }}/target/${{ matrix.target }}/release"
          for executable in "$release_dir/termkey" "$release_dir/termkey-native-host"; do
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_APPLICATION_SIGNING_IDENTITY" \
              "$executable"
            codesign --verify --strict --verbose=2 "$executable"
          done

      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Prepare asset (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "target/${{ matrix.target }}/release"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "${{ matrix.asset_name }}.zip"
          $installerScript = Join-Path $env:GITHUB_WORKSPACE "apps\cli\packaging\windows\termkey.iss"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = $env:RELEASE_VERSION
          $stagingDir = Join-Path $env:RUNNER_TEMP "${{ matrix.asset_name }}-bundle"
          $extensionDir = Join-Path $stagingDir "browser-extension\chrome"

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }

          Remove-Item -Recurse -Force $stagingDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extensionDir | Out-Null

          Copy-Item (Join-Path $releaseDir "termkey.exe") $stagingDir
          Copy-Item (Join-Path $releaseDir "termkey-native-host.exe") $stagingDir
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "apps\extension\manifest.json") (Join-Path $extensionDir "manifest.json")
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "apps\extension\popup.html") (Join-Path $extensionDir "popup.html")
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "apps\extension\prompt.html") (Join-Path $extensionDir "prompt.html")
          Copy-Item -Recurse -Force (Join-Path $env:GITHUB_WORKSPACE "apps\extension\dist") (Join-Path $extensionDir "dist")
          Copy-Item -Recurse -Force (Join-Path $env:GITHUB_WORKSPACE "apps\extension\public") (Join-Path $extensionDir "public")

          Compress-Archive -Path (Join-Path $stagingDir "*") -DestinationPath $zipPath
          & $iscc "/DAppVersion=$version" "/DSourceDir=$stagingDir" "/DOutputDir=$env:GITHUB_WORKSPACE" $installerScript

      - name: Sign Windows installer
        if: matrix.platform == 'windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE "TermKey-Setup.exe"
          & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer
          if ($LASTEXITCODE -ne 0) { throw "Windows installer signing failed" }
          & $env:WINDOWS_SIGNTOOL verify /pa $installer
          if ($LASTEXITCODE -ne 0) { throw "Windows installer signature verification failed" }

          "### Windows artifacts are signed`n`nThe executables and installer were signed and their signatures verified." >> $env:GITHUB_STEP_SUMMARY

      - name: Prepare asset (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          release_dir="${{ github.workspace }}/target/${{ matrix.target }}/release"
          staging_dir=$(mktemp -d)
          trap 'rm -rf "$staging_dir"' EXIT

          mkdir -p "$staging_dir/browser-extension/chrome"
          cp "$release_dir/termkey" "$staging_dir/termkey"
          cp "$release_dir/termkey-native-host" "$staging_dir/termkey-native-host"
          cp "${{ github.workspace }}/apps/extension/manifest.json" "$staging_dir/browser-extension/chrome/manifest.json"
          cp "${{ github.workspace }}/apps/extension/popup.html" "$staging_dir/browser-extension/chrome/popup.html"
          cp "${{ github.workspace }}/apps/extension/prompt.html" "$staging_dir/browser-extension/chrome/prompt.html"
          cp -R "${{ github.workspace }}/apps/extension/dist" "$staging_dir/browser-extension/chrome/dist"
          cp -R "${{ github.workspace }}/apps/extension/public" "$staging_dir/browser-extension/chrome/public"

          cd "$staging_dir"
          zip -r "${{ github.workspace }}/${{ matrix.asset_name }}.zip" termkey termkey-native-host browser-extension

      - name: Prepare asset (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          TERMKEY_MACOS_ARCH: ${{ matrix.macos_arch }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: |
          release_dir="${{ github.workspace }}/target/${{ matrix.target }}/release"
          staging_dir=$(mktemp -d)
          trap 'rm -rf "$staging_dir"' EXIT

          mkdir -p "$staging_dir/browser-extension/chrome"
          cp "$release_dir/termkey" "$staging_dir/termkey"
          cp "$release_dir/termkey-native-host" "$staging_dir/termkey-native-host"
          cp "${{ github.workspace }}/apps/extension/manifest.json" "$staging_dir/browser-extension/chrome/manifest.json"
          cp "${{ github.workspace }}/apps/extension/popup.html" "$staging_dir/browser-extension/chrome/popup.html"
          cp "${{ github.workspace }}/apps/extension/prompt.html" "$staging_dir/browser-extension/chrome/prompt.html"
          cp -R "${{ github.workspace }}/apps/extension/dist" "$staging_dir/browser-extension/chrome/dist"
          cp -R "${{ github.workspace }}/apps/extension/public" "$staging_dir/browser-extension/chrome/public"

          cd "$staging_dir"
          zip -r "${{ github.workspace }}/${{ matrix.asset_name }}.zip" termkey termkey-native-host browser-extension

          PACKAGE_NAME="${{ matrix.asset_name }}-installer"

          TERMKEY_NATIVE_HOST_BINARY="${release_dir}/termkey-native-host" \
          TERMKEY_EXTENSION_DIR="$staging_dir/browser-extension/chrome" \
            "${{ github.workspace }}/apps/cli/packaging/macos/create-pkg.sh" \
            "${{ github.workspace }}/target/${{ matrix.target }}/release/termkey" \
            "${RELEASE_VERSION}" \
            "${PACKAGE_NAME}" \
            "${{ github.workspace }}"

          "${{ github.workspace }}/apps/cli/packaging/macos/create-dmg.sh" \
            "${{ github.workspace }}/${PACKAGE_NAME}.pkg" \
            "${{ matrix.asset_name }}" \
            "TermKey ${{ matrix.target }}" \
            "${{ github.workspace }}"

          if [[ ! -f "${{ github.workspace }}/${{ matrix.asset_name }}.dmg" \
            && -f "${{ github.workspace }}/${{ matrix.asset_name }}.dmg.dmg" ]]; then
            mv "${{ github.workspace }}/${{ matrix.asset_name }}.dmg.dmg" \
              "${{ github.workspace }}/${{ matrix.asset_name }}.dmg"
          fi
          test -f "${{ github.workspace }}/${{ matrix.asset_name }}.dmg"

          if [[ "${APPLE_SIGNING_ENABLED:-false}" == "true" ]]; then
            codesign --force --timestamp \
              --sign "$APPLE_APPLICATION_SIGNING_IDENTITY" \
              "${{ github.workspace }}/${{ matrix.asset_name }}.dmg"
            codesign --verify --strict --verbose=2 \
              "${{ github.workspace }}/${{ matrix.asset_name }}.dmg"
            {
              echo "### macOS artifacts are signed"
              echo
              echo "The executables, app bundles, package, and disk image were signed and verified."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove signing material
        if: always() && matrix.platform == 'windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $certificatePath = $env:WINDOWS_CERTIFICATE_PATH
          if ([string]::IsNullOrWhiteSpace($certificatePath)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "termkey-signing.pfx"
          }
          if (Test-Path -LiteralPath $certificatePath) {
            Remove-Item -Force -LiteralPath $certificatePath
          }

      - name: Remove Apple signing material
        if: always() && matrix.platform == 'macos' && env.APPLE_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          keychain_path=${APPLE_KEYCHAIN_PATH:-"$RUNNER_TEMP/termkey-signing.keychain-db"}
          certificate_path=${APPLE_CERTIFICATE_PATH:-"$RUNNER_TEMP/termkey-signing.p12"}
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f "$certificate_path"

      - name: Upload artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.zip
            TermKey-Setup.exe
          if-no-files-found: error

      - name: Upload artifact (Unix)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip
          if-no-files-found: error

      - name: Upload artifact (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}-installer.pkg
            ${{ matrix.asset_name }}.dmg
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Generate release checksums
        run: |
          node scripts/release-checksums.mjs artifacts artifacts/SHA256SUMS \
            termkey-linux-x86_64.zip \
            termkey-macos-x86_64.zip \
            termkey-macos-x86_64-installer.pkg \
            termkey-macos-x86_64.dmg \
            termkey-macos-aarch64.zip \
            termkey-macos-aarch64-installer.pkg \
            termkey-macos-aarch64.dmg \
            termkey-windows-x86_64.zip \
            TermKey-Setup.exe

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*/*.zip
            artifacts/*/*.exe
            artifacts/*/*.pkg
            artifacts/*/*.dmg
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-tap:
    name: Update Homebrew Tap
    needs: release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Compute SHA256s and update formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          SHA_LINUX=$(sha256sum artifacts/termkey-linux-x86_64/termkey-linux-x86_64.zip | awk '{print $1}')
          SHA_MACOS_X86=$(sha256sum artifacts/termkey-macos-x86_64/termkey-macos-x86_64.zip | awk '{print $1}')
          SHA_MACOS_ARM=$(sha256sum artifacts/termkey-macos-aarch64/termkey-macos-aarch64.zip | awk '{print $1}')

          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/ryanonmars/homebrew-termkey.git tap
          cd tap

          VER=${VERSION#v}

          find Formula -maxdepth 1 -type f -name '*.rb' ! -name 'termkey.rb' -exec grep -l 'github.com/ryanonmars/termkey' {} + | xargs -r rm -f

          cat > Formula/termkey.rb << EOF
          # typed: false
          # frozen_string_literal: true

          class Termkey < Formula
            desc "CLI encrypted storage for private keys and seed phrases"
            homepage "https://github.com/ryanonmars/termkey"
            url "https://github.com/ryanonmars/termkey/releases/download/${VERSION}/termkey-linux-x86_64.zip"
            version "${VER}"
            sha256 "${SHA_LINUX}"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/ryanonmars/termkey/releases/download/${VERSION}/termkey-macos-x86_64.zip"
                sha256 "${SHA_MACOS_X86}"
              end

              on_arm do
                url "https://github.com/ryanonmars/termkey/releases/download/${VERSION}/termkey-macos-aarch64.zip"
                sha256 "${SHA_MACOS_ARM}"
              end
            end

            def install
              bin.install "termkey"
              libexec.install "termkey-native-host"
              pkgshare.install "browser-extension"
            end

            test do
              assert_match "Encrypted storage for", shell_output("#{bin}/termkey --help")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Formula
          git commit -m "termkey ${VER}"
          git push

  validate-tap:
    name: Validate Homebrew Tap
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Validate tap access and formula output
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          SHA_LINUX=$(sha256sum artifacts/termkey-linux-x86_64/termkey-linux-x86_64.zip | awk '{print $1}')
          SHA_MACOS_X86=$(sha256sum artifacts/termkey-macos-x86_64/termkey-macos-x86_64.zip | awk '{print $1}')
          SHA_MACOS_ARM=$(sha256sum artifacts/termkey-macos-aarch64/termkey-macos-aarch64.zip | awk '{print $1}')

          git ls-remote https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/ryanonmars/homebrew-termkey.git HEAD

          VER="0.0.0-dry-run"

          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## Dry Run Formula Preview

          - Ref: ${REF_NAME}
          - Linux SHA256: \`${SHA_LINUX}\`
          - macOS Intel SHA256: \`${SHA_MACOS_X86}\`
          - macOS ARM SHA256: \`${SHA_MACOS_ARM}\`

          \`\`\`ruby
          class Termkey < Formula
            desc "CLI encrypted storage for private keys and seed phrases"
            homepage "https://github.com/ryanonmars/termkey"
            url "https://github.com/ryanonmars/termkey/releases/download/v${VER}/termkey-linux-x86_64.zip"
            version "${VER}"
            sha256 "${SHA_LINUX}"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/ryanonmars/termkey/releases/download/v${VER}/termkey-macos-x86_64.zip"
                sha256 "${SHA_MACOS_X86}"
              end

              on_arm do
                url "https://github.com/ryanonmars/termkey/releases/download/v${VER}/termkey-macos-aarch64.zip"
                sha256 "${SHA_MACOS_ARM}"
              end
            end

            def install
              bin.install "termkey"
              libexec.install "termkey-native-host"
              pkgshare.install "browser-extension"
            end
          end
          \`\`\`
          EOF
