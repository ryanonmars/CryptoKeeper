name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TERMKEY_TRUSTED_BUILD: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.trusted_build)) && 'true' || 'false' }}
  TERMKEY_PUBLISH_RELEASE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'true' || 'false' }}
  TERMKEY_RELEASE_MODE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'tag-production' || (github.event_name == 'workflow_dispatch' && inputs.trusted_build) && 'trusted-validation' || 'unsigned-dry-run' }}
  target: aarch64-apple-darwin
  macos_arch: arm64
  macos_deployment_target: '11.0'
  asset_name: termkey-macos-aarch64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      trusted_build:
        description: 'Sign, notarize, and verify without publishing'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: macos-15
    outputs:
      release_version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Resolve validated release version
        id: release-version
        shell: bash
        env:
          TAG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          project_version=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/cli/Cargo.toml | head -n 1)
          if [[ -z "$project_version" ]]; then
            echo "Could not resolve the project version" >&2
            exit 1
          fi

          node scripts/validate-release-version.mjs "${TAG_VERSION:-v$project_version}"
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate:phase1

      - name: Audit JavaScript dependencies
        run: npm audit

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2

      - name: Audit Rust dependencies
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo audit --file Cargo.lock

  build:
    name: Build Apple Silicon artifacts — ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'tag-production' || (github.event_name == 'workflow_dispatch' && inputs.trusted_build) && 'trusted-validation' || 'unsigned-dry-run' }}
    needs: validate
    runs-on: macos-15
    environment:
      name: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.trusted_build)) && 'apple-release-validation' || 'unsigned-dry-run' }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact release source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build release binaries
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo build --release --target aarch64-apple-darwin --locked

      - name: Summarize release mode
        shell: bash
        run: |
          case "$TERMKEY_RELEASE_MODE" in
            unsigned-dry-run)
              mode_description='Unsigned validation artifacts; no credentials or publishing.'
              ;;
            trusted-validation)
              mode_description='Signed, notarized, and verified artifacts; publishing is disabled.'
              ;;
            tag-production)
              mode_description='Signed, notarized, verified, and eligible for gated publication.'
              ;;
            *)
              echo "Unknown release mode: $TERMKEY_RELEASE_MODE" >&2
              exit 1
              ;;
          esac
          {
            echo "## Release mode: $TERMKEY_RELEASE_MODE"
            echo
            echo "$mode_description"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure unsigned dry run
        if: env.TERMKEY_TRUSTED_BUILD == 'false'
        shell: bash
        run: echo "TERMKEY_RELEASE_SIGNING=disabled" >> "$GITHUB_ENV"

      - name: Check trusted build credentials
        if: env.TERMKEY_TRUSTED_BUILD == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for secret_name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_APPLICATION_SIGNING_IDENTITY \
            APPLE_INSTALLER_SIGNING_IDENTITY \
            APPLE_NOTARY_KEY_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_TEAM_ID; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required secret: $secret_name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure ephemeral Apple credentials
        if: env.TERMKEY_TRUSTED_BUILD == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          certificate_path="$RUNNER_TEMP/termkey-signing.p12"
          keychain_path="$RUNNER_TEMP/termkey-signing.keychain-db"
          notary_key_path="$RUNNER_TEMP/AuthKey_$APPLE_NOTARY_KEY_ID.p8"
          original_keychains_path="$RUNNER_TEMP/termkey-original-keychains.txt"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          umask 077

          echo "APPLE_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"
          echo "APPLE_ORIGINAL_KEYCHAINS_PATH=$original_keychains_path" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          keychain_search_list=$(security list-keychains -d user)
          : > "$original_keychains_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychain=${existing_keychain#"${existing_keychain%%[![:space:]]*}"}
            existing_keychain=${existing_keychain%"${existing_keychain##*[![:space:]]}"}
            if [[ "${existing_keychain:0:1}" == '"' && "${existing_keychain: -1}" == '"' ]]; then
              existing_keychain=${existing_keychain#\"}
              existing_keychain=${existing_keychain%\"}
            fi
            if [[ -n "$existing_keychain" ]]; then
              existing_keychains+=("$existing_keychain")
              printf '%s\n' "$existing_keychain" >> "$original_keychains_path"
            fi
          done <<< "$keychain_search_list"
          security list-keychains -d user -s "${existing_keychains[@]}" "$keychain_path"

          case "$APPLE_APPLICATION_SIGNING_IDENTITY" in
            "Developer ID Application: "*) ;;
            *) echo "APPLE_APPLICATION_SIGNING_IDENTITY must be a Developer ID Application identity" >&2; exit 1 ;;
          esac
          case "$APPLE_INSTALLER_SIGNING_IDENTITY" in
            "Developer ID Installer: "*) ;;
            *) echo "APPLE_INSTALLER_SIGNING_IDENTITY must be a Developer ID Installer identity" >&2; exit 1 ;;
          esac
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "APPLE_TEAM_ID must be exactly 10 uppercase alphanumeric characters" >&2
            exit 1
          fi
          if [[ "$APPLE_APPLICATION_SIGNING_IDENTITY" != *" ($APPLE_TEAM_ID)" ]]; then
            echo "APPLE_APPLICATION_SIGNING_IDENTITY does not match APPLE_TEAM_ID" >&2
            exit 1
          fi
          if [[ "$APPLE_INSTALLER_SIGNING_IDENTITY" != *" ($APPLE_TEAM_ID)" ]]; then
            echo "APPLE_INSTALLER_SIGNING_IDENTITY does not match APPLE_TEAM_ID" >&2
            exit 1
          fi

          application_identities=$(security find-identity -v -p codesigning "$keychain_path" | sed -nE 's/^[[:space:]]*[0-9]+\) [[:xdigit:]]+ "(.*)"$/\1/p')
          installer_identities=$(security find-identity -v "$keychain_path" | sed -nE 's/^[[:space:]]*[0-9]+\) [[:xdigit:]]+ "(.*)"$/\1/p')
          if [[ $(printf '%s\n' "$application_identities" | grep -Fxc -- "$APPLE_APPLICATION_SIGNING_IDENTITY") -ne 1 ]]; then
            echo "Configured keychain does not contain the exact application signing identity" >&2
            exit 1
          fi
          if [[ $(printf '%s\n' "$installer_identities" | grep -Fxc -- "$APPLE_INSTALLER_SIGNING_IDENTITY") -ne 1 ]]; then
            echo "Configured keychain does not contain the exact installer signing identity" >&2
            exit 1
          fi

          echo "TERMKEY_RELEASE_SIGNING=required" >> "$GITHUB_ENV"

      - name: Sign release binaries
        if: env.TERMKEY_TRUSTED_BUILD == 'true'
        shell: bash
        env:
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
        run: |
          release_dir="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release"
          for executable in "$release_dir/termkey" "$release_dir/termkey-native-host"; do
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_APPLICATION_SIGNING_IDENTITY" \
              "$executable"
            codesign --verify --strict --verbose=2 "$executable"
          done

      - name: Create signed PKG
        if: env.TERMKEY_TRUSTED_BUILD == 'true'
        shell: bash
        env:
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          TERMKEY_MACOS_ARCH: arm64
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          release_dir="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release"
          TERMKEY_NATIVE_HOST_BINARY="$release_dir/termkey-native-host" \
            apps/cli/packaging/macos/create-pkg.sh \
            "$release_dir/termkey" \
            "$RELEASE_VERSION" \
            "termkey-macos-aarch64-installer" \
            "$GITHUB_WORKSPACE"

      - name: Create unsigned PKG
        if: env.TERMKEY_TRUSTED_BUILD == 'false'
        shell: bash
        env:
          TERMKEY_MACOS_ARCH: arm64
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          release_dir="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release"
          TERMKEY_NATIVE_HOST_BINARY="$release_dir/termkey-native-host" \
            apps/cli/packaging/macos/create-pkg.sh \
            "$release_dir/termkey" \
            "$RELEASE_VERSION" \
            "termkey-macos-aarch64-installer" \
            "$GITHUB_WORKSPACE"

      - name: Notarize and staple PKG
        if: env.TERMKEY_TRUSTED_BUILD == 'true'
        shell: bash
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          apps/cli/packaging/macos/notarize-artifact.sh \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64-installer.pkg" \
            pkg

      - name: Create DMG
        shell: bash
        run: |
          apps/cli/packaging/macos/create-dmg.sh \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64-installer.pkg" \
            "termkey-macos-aarch64" \
            "TermKey aarch64-apple-darwin" \
            "$GITHUB_WORKSPACE"

          if [[ ! -f "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg" \
            && -f "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg.dmg" ]]; then
            mv "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg.dmg" \
              "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg"
          fi
          test -f "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg"

      - name: Sign DMG
        if: env.TERMKEY_TRUSTED_BUILD == 'true'
        shell: bash
        env:
          APPLE_APPLICATION_SIGNING_IDENTITY: ${{ secrets.APPLE_APPLICATION_SIGNING_IDENTITY }}
        run: |
          codesign --force --timestamp \
            --sign "$APPLE_APPLICATION_SIGNING_IDENTITY" \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg"
          codesign --verify --strict --verbose=2 \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg"

      - name: Notarize and staple DMG
        if: env.TERMKEY_TRUSTED_BUILD == 'true'
        shell: bash
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          apps/cli/packaging/macos/notarize-artifact.sh \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg" \
            dmg

      - name: Create ZIP from release payload
        shell: bash
        run: |
          release_dir="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release"
          staging_dir="$RUNNER_TEMP/termkey-macos-aarch64-zip"
          zip_path="$GITHUB_WORKSPACE/termkey-macos-aarch64.zip"
          mkdir -p "$staging_dir"
          ditto --norsrc "$release_dir/termkey" "$staging_dir/termkey"
          ditto --norsrc "$release_dir/termkey-native-host" "$staging_dir/termkey-native-host"

          ditto -c -k --norsrc "$staging_dir" "$zip_path"

      - name: Notarize ZIP
        if: env.TERMKEY_TRUSTED_BUILD == 'true'
        shell: bash
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          apps/cli/packaging/macos/notarize-artifact.sh \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64.zip" \
            zip

      - name: Verify trusted release artifacts
        if: env.TERMKEY_TRUSTED_BUILD == 'true'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          apps/cli/packaging/macos/verify-artifacts.sh \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64-installer.pkg" \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg" \
            "$GITHUB_WORKSPACE/termkey-macos-aarch64.zip" \
            "$APPLE_TEAM_ID"

      - name: Verify unsigned dry-run artifacts
        if: env.TERMKEY_TRUSTED_BUILD == 'false'
        shell: bash
        run: |
          release_dir="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release"
          for executable in "$release_dir/termkey" "$release_dir/termkey-native-host"; do
            test "$(lipo -archs "$executable")" = "arm64"
            minos=$(otool -l "$executable" | awk '
              $1 == "cmd" && $2 == "LC_BUILD_VERSION" { command = "build"; next }
              $1 == "cmd" && $2 == "LC_VERSION_MIN_MACOSX" { command = "legacy"; next }
              command == "build" && $1 == "minos" { print $2; exit }
              command == "legacy" && $1 == "version" { print $2; exit }
            ')
            [[ "$minos" == "11.0" || "$minos" == "11.0.0" ]]
          done

          zip_roots=$(unzip -Z1 "$GITHUB_WORKSPACE/termkey-macos-aarch64.zip" \
            | awk -F/ 'NF && $1 != "" { print $1 }' \
            | LC_ALL=C sort -u)
          expected_zip_roots=$'termkey\ntermkey-native-host'
          test "$zip_roots" = "$expected_zip_roots"
          pkgutil --payload-files "$GITHUB_WORKSPACE/termkey-macos-aarch64-installer.pkg" \
            | grep -Fqx './usr/local/bin/termkey'
          hdiutil imageinfo "$GITHUB_WORKSPACE/termkey-macos-aarch64.dmg" > /dev/null

      - name: Upload notarization rejection logs
        if: always() && env.TERMKEY_TRUSTED_BUILD == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termkey-notarization-rejection-logs-${{ env.TERMKEY_RELEASE_MODE }}
          path: ${{ runner.temp }}/termkey-notary-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove Apple credentials
        if: always()
        shell: bash
        run: |
          keychain_path=${APPLE_KEYCHAIN_PATH:-"$RUNNER_TEMP/termkey-signing.keychain-db"}
          certificate_path=${APPLE_CERTIFICATE_PATH:-"$RUNNER_TEMP/termkey-signing.p12"}
          original_keychains_path=${APPLE_ORIGINAL_KEYCHAINS_PATH:-"$RUNNER_TEMP/termkey-original-keychains.txt"}
          cleanup_status=0
          if [[ -f "$original_keychains_path" ]]; then
            original_keychains=()
            while IFS= read -r original_keychain || [[ -n "$original_keychain" ]]; do
              if [[ -n "$original_keychain" ]]; then
                original_keychains+=("$original_keychain")
              fi
            done < "$original_keychains_path"
            security list-keychains -d user -s "${original_keychains[@]}" || cleanup_status=$?
          fi
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f "$certificate_path" "$original_keychains_path"
          shopt -s nullglob
          notary_key_paths=("$RUNNER_TEMP"/AuthKey_*.p8)
          if (( ${#notary_key_paths[@]} > 0 )); then
            rm -f "${notary_key_paths[@]}"
          fi
          exit "$cleanup_status"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termkey-macos-aarch64-${{ env.TERMKEY_RELEASE_MODE }}
          path: |
            termkey-macos-aarch64.dmg
            termkey-macos-aarch64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release (tag-production)
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Fail if release tag already exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing_release_tags=$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name')
          if printf '%s\n' "$existing_release_tags" | grep -Fqx -- "$GITHUB_REF_NAME"; then
            echo "A release or draft already exists for tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Download public artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: termkey-macos-aarch64-tag-production
          path: artifacts/termkey-macos-aarch64

      - name: Generate release checksums
        run: |
          node scripts/release-checksums.mjs artifacts artifacts/SHA256SUMS \
            termkey-macos-aarch64.dmg \
            termkey-macos-aarch64.zip

      - name: Create draft Release
        id: create-draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/termkey-macos-aarch64/termkey-macos-aarch64.dmg
            artifacts/termkey-macos-aarch64/termkey-macos-aarch64.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and publish draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.create-draft.outputs.id }}
        run: |
          if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Draft action did not return a valid numeric release ID" >&2
            exit 1
          fi
          release_json="$RUNNER_TEMP/termkey-release-$GITHUB_RUN_ID.json"
          trap 'rm -f "$release_json"' EXIT
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > "$release_json"

          if [[ $(jq -r '.tag_name' "$release_json") != "$GITHUB_REF_NAME" ]]; then
            echo "Draft release tag did not match $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ $(jq -r '.draft' "$release_json") != 'true' ]]; then
            echo "Release for $GITHUB_REF_NAME was not an unpublished draft" >&2
            exit 1
          fi

          actual_assets=$(jq -r '.assets[].name' "$release_json" | LC_ALL=C sort)
          expected_assets=$'SHA256SUMS\ntermkey-macos-aarch64.dmg\ntermkey-macos-aarch64.zip'
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Draft release assets did not match the exact public manifest" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_assets" "$actual_assets" >&2
            exit 1
          fi

          release_id=$(jq -r '.id' "$release_json")
          if [[ "$release_id" != "$RELEASE_ID" ]]; then
            echo "Queried draft release ID did not match the created release" >&2
            exit 1
          fi
          published_state=$(gh api --method PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            --jq '.draft')
          if [[ "$published_state" != 'false' ]]; then
            echo "Release $release_id did not publish" >&2
            exit 1
          fi

  update-tap:
    name: Update Homebrew Tap (tag-production)
    needs: release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: termkey-macos-aarch64-tag-production
          path: artifacts/termkey-macos-aarch64

      - name: Compute SHA256 and update formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          SHA_MACOS_ARM=$(shasum -a 256 artifacts/termkey-macos-aarch64/termkey-macos-aarch64.zip | awk '{print $1}')
          VER=${VERSION#v}
          formula_path="$RUNNER_TEMP/termkey.rb"

          node scripts/render-homebrew-formula.mjs "$VER" "$SHA_MACOS_ARM" "$formula_path"

          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/ryanonmars/homebrew-termkey.git tap
          mkdir -p tap/Formula

          find tap/Formula -maxdepth 1 -type f -name '*.rb' ! -name 'termkey.rb' -exec grep -l 'github.com/ryanonmars/termkey' {} + | xargs -r rm -f
          cp "$formula_path" tap/Formula/termkey.rb
          cd tap

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Formula
          git commit -m "termkey ${VER}"
          git push

  validate-tap:
    name: Validate Homebrew Tap (${{ github.event_name == 'workflow_dispatch' && inputs.trusted_build && 'trusted-validation' || 'unsigned-dry-run' }})
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: termkey-macos-aarch64-${{ env.TERMKEY_RELEASE_MODE }}
          path: artifacts/termkey-macos-aarch64

      - name: Validate tap access and formula output
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          SHA_MACOS_ARM=$(shasum -a 256 artifacts/termkey-macos-aarch64/termkey-macos-aarch64.zip | awk '{print $1}')
          formula_path="$RUNNER_TEMP/termkey.rb"

          git ls-remote https://github.com/ryanonmars/homebrew-termkey.git HEAD

          node scripts/render-homebrew-formula.mjs 0.0.0 "$SHA_MACOS_ARM" "$formula_path"

          {
            echo "## Homebrew formula preview: $TERMKEY_RELEASE_MODE"
            echo
            echo "- Ref: ${REF_NAME}"
            echo "- macOS ARM SHA256: \`${SHA_MACOS_ARM}\`"
            echo
            echo "\`\`\`ruby"
            cat "$formula_path"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
